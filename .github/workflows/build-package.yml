# 修改说明：首次生成，未做改动
# 每个步骤都带注释，可直接修改；改完请在上方填写修改说明再保存。

name: Build Package

on:
  workflow_dispatch:   # 允许在 App 里点「手动触发构建」
    inputs:
      app_name:
        description: 安装包名称
        default: '听书'
      version_name:
        description: 版本号（versionName）
        default: '1'
      version_code:
        description: 版本代号（versionCode，整数）
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 打包；-x 后面是要排除的目录
      - name: Zip
        run: zip -r app.zip . -x '.git/*'

      # 把产物改成你指定的安装包名称
      - name: Rename APK
        env:
          NAME: ${{ github.event.inputs.app_name }}
          VN: ${{ github.event.inputs.version_name }}
        run: |
          APK=$(find . -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            D=$(dirname "$APK")
            mv "$APK" "$D/$NAME-$VN.apk"
            echo "产物: $D/$NAME-$VN.apk"
          fi

      # 上传产物
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.version_name }}
          path: app.zip
          if-no-files-found: error
